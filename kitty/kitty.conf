include ./gruvbox.conf
font_family      Maple Mono NF CN
font_size        20
cursor_shape block
shell_integration no-cursor
cursor_blink_interval 0
cursor none

confirm_os_window_close 0
background_opacity 0.7

remember_window_size no
initial_window_width 1500
initial_window_height 900

resize_debounce_time 0

copy_on_select yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

mouse_map right press ungrabbed paste_from_clipboard

map ctrl+o kitten hints --type regex --hints-text-color #000000 --hints-text-background-color #DD9400 --hints-foreground-color #ffffff  --hints-background-color #D02C2C  --alphabet "asuidfglqwertyhjkopzxcvbnm" --regex '(?i)(?:https?://|www\.)[^\s<>"{}|\\^`]+|\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b|\b\d{1,3}(?:\.\d{1,3}){3}\b|\b(?:[A-F0-9]{1,4}:){2,}[A-F0-9]{1,4}\b|(?:~?/[^\s<>"{}|\\^`]+)|\bghp_[0-9A-Z]{36}\b|\bcore-[0-9A-Z]+-[0-9A-Z]+-[0-9A-Z]+\b|\b0x[0-9A-F]+\b|\b[0-9A-F]{40}\b|\b\d{4}\b|\b\d{6}\b' --program @
map ctrl+u kitten hints --type url --hints-text-color #000000 --hints-text-background-color #DD9400 --hints-foreground-color #ffffff  --hints-background-color #D02C2C --alphabet "asuidfglqwertyhjkopzxcvbnm"

map ctrl+i launch --type=overlay --stdin-source=@screen_scrollback nvim -c "set nonumber norelativenumber laststatus=0 signcolumn=no" -c "normal G" -c "set buftype=nofile" -
